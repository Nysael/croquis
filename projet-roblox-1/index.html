<div class="wrap">
  <h1>Auras des œufs en jeu</h1>
  <p>Les nouvelles auras (une signature par rareté), filmées dans Studio le 22/10 sur des œufs de test, en plein jour. Dans le jeu, elles s'affichent sur les vrais œufs de chaque espèce.</p>
  <figure><video src="auras-en-jeu.mp4" controls muted loop playsinline></video><figcaption>Les 10 raretés, de gauche à droite : Commun, Peu commun, Rare, Épique, Légendaire, Mythique, Divin, Céleste, Cosmique, Secret (première version : feuilles, rayons et ailes corrigés ensuite).</figcaption></figure>
  <figure><video src="auras-corrigees.mp4" controls muted loop playsinline></video><figcaption>Après correction : feuilles qui tombent (Peu commun), rayons dorés (Légendaire), Divin.</figcaption></figure>
  <figure><img src="divin-ailes.jpg" alt="Œuf Divin avec ses ailes de lumière"><figcaption>Divin, de près : les deux ailes de lumière (elles battent en jeu) et l'auréole.</figcaption></figure>
