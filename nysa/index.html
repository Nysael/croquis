<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Nysa</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
  <div id="shoulders"></div>
  <div id="island">
    <div id="compact">
      <div class="mascot m-sm idle" id="mSmall"></div>
      <div class="mid" id="mid"></div>
      <div class="blobs" id="blobs"></div>
    </div>

    <div id="panel">
      <header>
        <div class="mascot m-lg idle" id="mLarge"></div>
        <div class="who">
          <h1>Nysa</h1>
          <div class="status"><i></i><span id="status">tout est calme</span></div>
        </div>
        <button class="iconbtn" id="pin" title="Garder ouverte"></button>
        <button class="iconbtn" id="close" title="Réduire"></button>
        <button class="iconbtn" id="quit" title="Quitter Nysa"></button>
      </header>
      <div class="tabs">
        <div class="slider" id="slider"></div>
        <button data-tab="sessions" class="on"></button>
        <button data-tab="perms"></button>
        <button data-tab="chat"></button>
        <button data-tab="sums"></button>
      </div>
      <main id="main">
        <section class="pane on" id="pane-sessions"></section>
        <section class="pane" id="pane-perms"></section>
        <section class="pane" id="pane-chat"><div id="chatlog"></div></section>
        <section class="pane" id="pane-sums"></section>
      </main>
      <div id="composer">
        <div class="top">
          <select id="project"></select>
          <button class="ghostbtn" id="newchat"></button>
        </div>
        <div class="inputwrap">
          <textarea id="input" placeholder="Demande quelque chose à Nysa…"></textarea>
          <button class="send" id="send" title="Envoyer (Entrée)"></button>
        </div>
      </div>
    </div>
    <div id="glow"></div>
  </div>
<script src="mascot.js"></script>
<script src="app.js"></script>
</body>
</html>
