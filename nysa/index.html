<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nysa</title>
<style>
  :root { --bg:#000; --card:#111114; --card2:#18181d; --line:#232329; --text:#ededf2; --muted:#8a8a96;
          --violet:#9b7bff; --gold:#ffd34d; --work:#9b7bff; --wait:#ffa53d; --ok:#4ade80; --err:#f87171; --idle:#6b6b78; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
               font:13.5px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select:none; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  svg.px { shape-rendering:crispEdges; display:block; }

  /* ---------- île réduite ---------- */
  #compact { display:flex; align-items:center; height:30px; padding:0 14px 0 13px; gap:10px; }
  body.panel #compact { display:none; }
  #compact .mid { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;
                  font-size:12.5px; opacity:0; transition:opacity .25s .1s; }
  body.wide #compact .mid { opacity:1; }
  #compact .mid small { color:var(--muted); font-weight:400; }

  /* ---------- mascotte ---------- */
  .mascot { position:relative; flex:none; }
  .mascot svg { width:100%; height:100%; }
  .m-sm { width:24px; height:21px; } .m-lg { width:42px; height:36px; }
  .mascot .eyes-closed, .mascot .eyes-happy { display:none; }
  .mascot.idle .eyes-open, .mascot.done .eyes-open { display:none; }
  .mascot.idle .eyes-closed { display:inline; } .mascot.done .eyes-happy { display:inline; }
  .mascot .eyes-open { animation:blink 4s infinite; transform-origin:50% 50%; transform-box:fill-box; }
  .mascot.work svg { animation:bob .7s ease-in-out infinite; }
  .mascot.work .eyes-open { animation:blink 4s infinite, look 2.4s steps(1) infinite; }
  .mascot.wait svg { animation:hop .55s ease-in-out infinite; }
  .mascot.done svg { animation:joy .9s ease-out 2; }
  .mascot.err svg { filter:hue-rotate(120deg) saturate(1.4); animation:shake .5s ease-in-out infinite; }
  .mascot .z { position:absolute; right:-7px; top:-3px; font:700 9px Consolas, monospace; color:#b9a8ff; opacity:0; }
  .mascot.idle .z { animation:zz 2.8s ease-in-out infinite; }
  .mascot .bang { position:absolute; right:-6px; top:-4px; font:900 11px Consolas, monospace; color:var(--wait); display:none; }
  .mascot.wait .bang { display:block; animation:hop .55s ease-in-out infinite; }
  @keyframes blink { 0%, 93%, 100% { transform:scaleY(1); } 96% { transform:scaleY(.15); } }
  @keyframes look { 0%, 100% { translate:0 0; } 33% { translate:-1px 0; } 66% { translate:1px 0; } }
  @keyframes bob { 0%, 100% { transform:translateY(0); } 50% { transform:translateY(-2px); } }
  @keyframes hop { 0%, 100% { transform:translateY(0); } 40% { transform:translateY(-3px); } }
  @keyframes joy { 0% { transform:translateY(0) scale(1); } 30% { transform:translateY(-4px) scale(1.06, .94); } 60% { transform:translateY(0) scale(.96, 1.05); } 100% { transform:none; } }
  @keyframes shake { 0%, 100% { translate:0; } 25% { translate:-1px; } 75% { translate:1px; } }
  @keyframes zz { 0% { opacity:0; transform:translate(0, 3px); } 40% { opacity:1; } 100% { opacity:0; transform:translate(4px, -6px); } }

  /* ---------- bouilles des sessions ---------- */
  .blobs { display:grid; grid-template-columns:repeat(2, 13px); grid-auto-rows:10px; gap:3px 4px; flex:none; }
  .blobs.one { grid-template-columns:13px; }
  .blob { position:relative; width:13px; height:10px; border-radius:5px 5px 4px 4px; background:var(--c); }
  .blob::before, .blob::after { content:""; position:absolute; top:3.5px; width:2.5px; height:3px; background:#0b0b10; border-radius:1px;
                                animation:peek var(--d, 3s) steps(1) infinite; }
  .blob::before { left:3px; } .blob::after { left:7.5px; }
  .blob.working { --c:var(--work); } .blob.waiting { --c:var(--wait); animation:hop .55s infinite; } .blob.done { --c:var(--ok); }
  .blob.error { --c:var(--err); } .blob.idle, .blob.ended { --c:var(--idle); }
  .more { font-size:10px; color:var(--muted); align-self:center; }
  @keyframes peek { 0%, 100% { translate:0 0; } 30% { translate:1.5px 0; } 60% { translate:-1px 0; } 80% { translate:0 -1px; } }

  /* ---------- panneau ---------- */
  #panel { display:none; flex-direction:column; height:100%; opacity:0; animation:fadein .2s ease-out forwards; }
  body.panel #panel { display:flex; }
  @keyframes fadein { to { opacity:1; } }
  header { display:flex; align-items:center; gap:12px; padding:14px 16px 8px; }
  header h1 { margin:0; font-size:17px; flex:1; letter-spacing:.2px; }
  header h1 small { display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:1px; }
  .icon { width:28px; height:28px; border-radius:8px; color:var(--muted); font-size:14px; }
  .icon:hover { background:var(--card2); color:var(--text); } .icon.on { background:var(--card2); color:var(--gold); }
  nav { display:flex; gap:4px; margin:4px 16px 10px; padding:3px; background:var(--card); border-radius:11px; }
  nav button { flex:1; padding:6px 4px; border-radius:8px; font-weight:600; font-size:12.5px; color:var(--muted); position:relative; }
  nav button.on { background:#24242c; color:var(--text); }
  nav .badge { position:absolute; top:-5px; right:2px; }
  .badge { min-width:17px; height:17px; border-radius:9px; padding:0 5px; font-size:10.5px; font-weight:800;
           display:inline-grid; place-items:center; background:var(--wait); color:#1a0f00; }
  main { flex:1; overflow-y:auto; padding:0 16px 16px; user-select:text; }
  main::-webkit-scrollbar { width:6px; } main::-webkit-scrollbar-thumb { background:#2a2a32; border-radius:3px; }
  .tab { display:none; } .tab.on { display:block; }
  .empty { color:var(--muted); text-align:center; padding:46px 14px; line-height:1.6; font-size:13px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:8px; }
  .proj { font-weight:650; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
  .chip::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .chip.working { background:#9b7bff1f; color:var(--work); } .chip.waiting { background:#ffa53d1f; color:var(--wait); }
  .chip.done { background:#4ade801f; color:var(--ok); } .chip.error { background:#f871711f; color:var(--err); }
  .chip.idle, .chip.ended { background:#ffffff0d; color:var(--muted); }
  .act { margin-top:6px; font-size:13px; }
  .meta { color:var(--muted); font-size:12px; margin-top:4px; line-height:1.45; }
  .meta i { color:#a9a9b6; font-style:normal; }
  .small-btn { background:var(--card2); border:1px solid var(--line); padding:4px 9px; border-radius:8px; font-size:12px; color:var(--text); }
  .small-btn:hover { background:#24242c; }

  .perm { border-color:#ffa53d55; }
  .perm .detail { background:#0a0a0d; border:1px solid var(--line); color:#ffd88a; font:12px Consolas, monospace; padding:8px 10px;
                  border-radius:9px; margin-top:8px; white-space:pre-wrap; word-break:break-all; max-height:140px; overflow:auto; }
  .perm .btns { display:flex; gap:7px; margin-top:10px; }
  .perm .btns button { flex:1; padding:8px; border-radius:10px; font-weight:700; }
  .yes { background:#16a34a; } .yes:hover { background:#1bb955; }
  .no { background:#26262e; } .no:hover { background:#3a2228; color:#ffb3b3; }
  .always { background:transparent; border:1px solid var(--line) !important; font-size:12px; color:var(--muted); font-weight:600 !important; }
  .always:hover { color:var(--text); background:var(--card2); }

  #chatlog { display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:88%; padding:9px 12px; border-radius:14px; line-height:1.5; font-size:13.5px; word-wrap:break-word; }
  .msg.me { align-self:flex-end; background:#2d2353; border-bottom-right-radius:4px; white-space:pre-wrap; }
  .msg.nysa { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg .p { font-size:11px; color:var(--muted); margin-bottom:3px; }
  .msg code { background:#0a0a0d; color:#ffd88a; padding:1px 5px; border-radius:5px; font-size:12px; }
  .msg pre { background:#0a0a0d; padding:8px; border-radius:8px; overflow-x:auto; font-size:12px; }
  .msg ul { margin:4px 0; padding-left:18px; } .msg a { color:var(--violet); }
  .msg h3 { font-size:13.5px; margin:8px 0 3px; color:var(--gold); }
  .typing { color:var(--muted); font-size:12.5px; display:flex; align-items:center; gap:8px; }
  #chatbar { border-top:1px solid var(--line); padding:10px 16px 14px; display:none; }
  body.chat #chatbar { display:block; }
  #chatbar .row { margin-bottom:7px; }
  select { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:4px 6px; font:inherit; font-size:12px; flex:1; }
  textarea { width:100%; resize:none; height:56px; background:var(--card); color:var(--text); border:1px solid var(--line);
             border-radius:12px; padding:8px 10px; font:inherit; outline:none; }
  textarea:focus { border-color:#4b3d99; }

  .sum h3 { margin:0; font-size:14px; flex:1; }
  .sum .body { margin-top:8px; line-height:1.55; font-size:13px; }
  .sum .body h3 { font-size:13.5px; color:var(--gold); margin:10px 0 4px; }
  .sum .body ul { margin:4px 0; padding-left:18px; }
</style>
</head>
<body>
  <div id="compact">
    <div class="mascot m-sm idle" id="mSmall"></div>
    <div class="mid" id="midText"></div>
    <div class="blobs" id="blobs"></div>
  </div>

  <div id="panel">
    <header>
      <div class="mascot m-lg idle" id="mLarge"></div>
      <h1>Nysa <small id="headSub">tout est calme</small></h1>
      <button class="icon" id="pinBtn" title="Garder ouverte">📌</button>
      <button class="icon" id="closeBtn" title="Réduire">⌃</button>
      <button class="icon" id="quitBtn" title="Quitter Nysa">⏻</button>
    </header>
    <nav>
      <button data-tab="sessions" class="on">Sessions</button>
      <button data-tab="perms">Autorisations <span id="permBadge"></span></button>
      <button data-tab="chat">Chat</button>
      <button data-tab="sums">Résumés</button>
    </nav>
    <main>
      <section class="tab on" id="tab-sessions"></section>
      <section class="tab" id="tab-perms"></section>
      <section class="tab" id="tab-chat"><div id="chatlog"></div></section>
      <section class="tab" id="tab-sums"></section>
    </main>
    <div id="chatbar">
      <div class="row">
        <select id="chatProject"></select>
        <button class="small-btn" id="newChat" title="Oublier la conversation de ce projet">Nouvelle conversation</button>
      </div>
      <textarea id="chatInput" placeholder="Demande quelque chose à Nysa… (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)"></textarea>
    </div>
  </div>

<script>
  // ----- la mascotte de Nysa, en pixel art (14 × 12) -----
  const SPRITE = [
    ".....yy.......",
    "....yy........",
    "....y.pppp....",
    "...pppppppp...",
    "..pwpppppppp..",
    "..pppppppppp..",
    ".pppppppppppp.",
    ".pcppppppppcp.",
    ".pppppddppppp.",
    ".ppppppppppdp.",
    "..pdpppppdpp..",
    "...dd.dd.dd...",
  ];
  const COLORS = { p: "#9b7bff", d: "#6a4fd0", w: "#e9e2ff", y: "#ffd34d", c: "#ff8fc8" };
  function mascotSVG() {
    let r = "";
    SPRITE.forEach((line, y) => [...line].forEach((ch, x) => { if (COLORS[ch]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${COLORS[ch]}"/>`; }));
    const k = "#160d33";
    const open = `<g class="eyes-open"><rect x="4" y="5" width="2" height="2" fill="${k}"/><rect x="8" y="5" width="2" height="2" fill="${k}"/><rect x="4" y="5" width="1" height="1" fill="#fff"/><rect x="8" y="5" width="1" height="1" fill="#fff"/></g>`;
    const closed = `<g class="eyes-closed"><rect x="4" y="6" width="2" height="1" fill="${k}"/><rect x="8" y="6" width="2" height="1" fill="${k}"/></g>`;
    const happy = `<g class="eyes-happy"><rect x="4" y="6" width="1" height="1" fill="${k}"/><rect x="5" y="5" width="1" height="1" fill="${k}"/><rect x="8" y="5" width="1" height="1" fill="${k}"/><rect x="9" y="6" width="1" height="1" fill="${k}"/></g>`;
    return `<svg class="px" viewBox="0 0 14 12">${r}${open}${closed}${happy}</svg><span class="z">z</span><span class="bang">!</span>`;
  }
  document.querySelectorAll(".mascot").forEach((m) => m.innerHTML = mascotSVG());

  // ----- état -----
  let api = null, version = -1, state = null, tab = "sessions", hover = false, leaveTimer = null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const STATUS = { working: "travaille", waiting: "t'attend", done: "a fini", error: "erreur", idle: "en pause", ended: "fermée" };
  const MOOD = { working: "work", waiting: "wait", done: "done", error: "err", idle: "idle" };

  function ago(t) {
    const s = Math.max(0, Date.now() / 1000 - t);
    if (s < 60) return "à l'instant";
    if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
    return `il y a ${Math.floor(s / 3600)} h`;
  }

  // Mini Markdown : titres, gras, italique, code, listes, liens (le texte est échappé d'abord)
  function md(text) {
    return esc(text).split(/```/).map((b, i) => {
      if (i % 2) return `<pre>${b.replace(/^\w*\n/, "")}</pre>`;
      const out = []; let list = false;
      for (let l of b.split("\n")) {
        l = l.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
             .replace(/(^|\s)\*([^*]+)\*/g, "$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
        const item = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/), head = l.match(/^#{1,4}\s+(.*)/);
        if (item) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${item[1]}</li>`); continue; }
        if (list) { out.push("</ul>"); list = false; }
        out.push(head ? `<h3>${head[1]}</h3>` : l.trim() ? `<div>${l}</div>` : "<div style='height:6px'></div>");
      }
      if (list) out.push("</ul>");
      return out.join("");
    }).join("");
  }

  function mood(s) {
    if (s.pending.length) return "waiting";
    if (s.toast) return s.toast.kind === "error" ? "error" : "done";
    if (s.sessions.some((x) => x.status === "working")) return "working";
    if (s.sessions.some((x) => x.status === "waiting")) return "waiting";
    return "idle";
  }

  function renderCompact(s) {
    const m = mood(s), working = s.sessions.filter((x) => x.status === "working");
    $("mSmall").className = "mascot m-sm " + MOOD[m];
    $("mLarge").className = "mascot m-lg " + MOOD[m];
    let text = "";
    if (s.pending.length) text = `${esc(s.pending[0].project)} <small>veut</small> ${esc(s.pending[0].action)}`;
    else if (s.toast) text = esc(s.toast.text);
    $("midText").innerHTML = text;
    const shown = s.sessions.slice(0, 4);
    $("blobs").className = "blobs" + (shown.length === 1 ? " one" : "");
    $("blobs").innerHTML = shown.map((x, i) => `<span class="blob ${x.status}" style="--d:${2.6 + i * 0.7}s" title="${esc(x.project)}"></span>`).join("") +
                           (s.sessions.length > 4 ? `<span class="more">+${s.sessions.length - 4}</span>` : "");
    $("headSub").textContent = { working: `${working.length} session${working.length > 1 ? "s" : ""} au travail`, waiting: "attend ta réponse",
                                 done: "une tâche vient de finir", error: "une session a un souci", idle: "tout est calme" }[m];
    $("permBadge").innerHTML = s.pending.length ? `<span class="badge">${s.pending.length}</span>` : "";
  }

  function renderSessions(s) {
    $("tab-sessions").innerHTML = s.sessions.length ? s.sessions.map((x) => `
      <div class="card">
        <div class="row"><span class="proj">${esc(x.title || x.project)}</span><span class="chip ${x.status}">${STATUS[x.status] || x.status}</span></div>
        <div class="act">${esc(x.action)}</div>
        ${x.prompt ? `<div class="meta"><i>Demande :</i> ${esc(x.prompt)}</div>` : ""}
        ${x.status === "done" && x.answer ? `<div class="meta"><i>Réponse :</i> ${esc(x.answer)}</div>` : ""}
        <div class="row" style="margin-top:8px"><span class="meta" style="flex:1;margin:0">${esc(x.project)} · ${ago(x.updated)}</span>
          ${x.cwd ? `<button class="small-btn" data-open="${esc(x.cwd)}">Ouvrir dans VS Code</button>` : ""}</div>
      </div>`).join("") : `<div class="empty">Aucune session Claude pour l'instant.<br>Lance Claude Code dans VS Code : Nysa la suivra ici.</div>`;
  }

  function renderPerms(s) {
    $("tab-perms").innerHTML = s.pending.length ? s.pending.map((p) => `
      <div class="card perm">
        <div class="row"><span class="proj">${esc(p.project)}</span><span class="meta" style="margin:0">${ago(p.at)}</span></div>
        <div class="act">${esc(p.action)} <span class="meta">· ${esc(p.tool)}</span></div>
        <div class="detail">${esc(p.detail)}</div>
        <div class="btns">
          <button class="yes" data-allow="${p.id}">Autoriser</button>
          <button class="no" data-deny="${p.id}">Refuser</button>
        </div>
        ${p.suggestions.length ? `<div class="btns"><button class="always" data-always="${p.id}">Autoriser et ne plus demander pour ce genre d'action</button></div>` : ""}
      </div>`).join("") : `<div class="empty">Aucune demande d'autorisation.<br>Quand Claude aura besoin de ton accord, l'île s'ouvrira toute seule ici.</div>`;
  }

  function renderChat(s) {
    const box = $("chatlog").parentElement, atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    $("chatlog").innerHTML = (s.chat.messages.length ? "" : `<div class="empty">Pose une question ou donne une tâche à Nysa.<br>Choisis d'abord le projet concerné en bas.</div>`) +
      s.chat.messages.map((m) => `<div class="msg ${m.who}">${m.who === "nysa" ? `<div class="p">Nysa · ${esc(m.project)}</div>${md(m.text)}` : esc(m.text)}</div>`).join("") +
      (s.chat.busy ? `<div class="typing"><div class="mascot m-sm work">${mascotSVG()}</div>Nysa travaille… les autorisations arriveront dans l'onglet Autorisations.</div>` : "");
    if (atBottom) box.scrollTop = box.scrollHeight;
    const sel = $("chatProject"), cur = sel.value;
    if (sel.options.length !== s.projects.length) {
      sel.innerHTML = s.projects.map((p) => `<option>${esc(p)}</option>`).join("");
      if (cur && s.projects.includes(cur)) sel.value = cur;
    }
    $("chatInput").disabled = s.chat.busy;
  }

  function renderSums(s) {
    const card = (kind, title, time) => {
      const x = s.summaries[kind] || {};
      return `<div class="card sum">
        <div class="row"><h3>${title}</h3><button class="small-btn" data-sum="${kind}" ${x.busy ? "disabled" : ""}>${x.busy ? "En cours…" : "Générer maintenant"}</button></div>
        <div class="meta">Chaque jour à ${esc(time)}, aussi envoyé sur Discord.${x.at ? ` Dernier : ${ago(x.at)}.` : ""}</div>
        <div class="body">${x.text ? md(x.text) : `<span class="meta">Pas encore de ${kind === "briefing" ? "briefing" : "récap"}.</span>`}</div>
      </div>`;
    };
    $("tab-sums").innerHTML = card("briefing", "Briefing du matin", s.times.briefing) + card("recap", "Récap du soir", s.times.recap);
  }

  function render(s) {
    document.body.classList.toggle("panel", s.expanded && s.mode === "panel");
    document.body.classList.toggle("wide", s.mode === "wide");
    if (s.mode !== "panel" && s.height) $("compact").style.height = s.height + "px";  // la fenêtre est plus haute que l'île visible
    $("pinBtn").classList.toggle("on", s.pinned);
    renderCompact(s);
    if (s.expanded) { renderSessions(s); renderPerms(s); renderChat(s); renderSums(s); }
  }

  function showTab(name) {
    tab = name;
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.id === "tab-" + name));
    document.body.classList.toggle("chat", name === "chat");
  }

  async function poll() {
    try {
      const s = await api.get_state(version);
      if (s.version !== version) {
        const hadPending = state && state.pending.length;
        version = s.version; state = s; render(s);
        if (s.pending.length && !hadPending) showTab("perms");
      }
    } catch (e) { /* l'API peut ne pas encore être prête */ }
    setTimeout(poll, 250);
  }

  // ----- interactions -----
  const enter = () => { hover = true; clearTimeout(leaveTimer); api && api.expand(true); };
  document.documentElement.addEventListener("mouseenter", enter);
  document.addEventListener("mousemove", () => { if (!hover) enter(); });
  document.documentElement.addEventListener("mouseleave", () => {
    hover = false; clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => { if (!hover && document.activeElement !== $("chatInput")) api.expand(false); }, 700);
  });
  document.querySelectorAll("nav button").forEach((b) => b.onclick = () => showTab(b.dataset.tab));
  $("pinBtn").onclick = () => api.pin(!(state && state.pinned));
  $("closeBtn").onclick = () => { api.pin(false); api.expand(false); };
  $("quitBtn").onclick = () => { if (confirm("Quitter Nysa ?")) api.quit(); };
  $("newChat").onclick = () => api.new_chat($("chatProject").value);
  $("chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      const t = e.target.value;
      if (t.trim()) { api.send_chat(t, $("chatProject").value); e.target.value = ""; }
    }
  });
  document.addEventListener("click", (e) => {
    const d = e.target.dataset;
    if (d.allow) api.decide(d.allow, "allow", false);
    else if (d.always) api.decide(d.always, "allow", true);
    else if (d.deny) api.decide(d.deny, "deny", false);
    else if (d.sum) api.summary(d.sum);
    else if (d.open) api.open_vscode(d.open);
  });
  window.addEventListener("pywebviewready", () => { api = window.pywebview.api; poll(); });
</script>
</body>
</html>
