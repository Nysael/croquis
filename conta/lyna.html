<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clique</title>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#14111f; color:#fff; font-family:system-ui, sans-serif; text-align:center; padding:16px; box-sizing:border-box; }
  button { font-size:28px; padding:20px 50px; border:none; border-radius:99px; background:#ff4f8b; color:#fff; cursor:pointer; }
  button:active { transform:scale(.9); }
  #msg { font-size:36px; }
  #msg b { display:block; font-size:70px; color:#ff4f8b; margin:10px 0; }
</style>
</head>
<body>
  <p id="txt">Clique 10 fois sur le bouton</p>
  <button id="btn">0 / 10</button>
  <p id="msg" hidden>Lyna, aurais-tu l'obligeance de <b>FERMER TA GUEULE</b> avec tout le respect 🙏</p>

<script>
  let n = 0;
  btn.onclick = () => {
    n++;
    btn.textContent = n + ' / 10';
    if (n === 10) {
      btn.hidden = true;
      txt.hidden = true;
      msg.hidden = false;
    }
  };
</script>
</body>
</html>
