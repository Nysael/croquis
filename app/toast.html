<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Nysa · notifications</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent; }
  #stack { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column-reverse; gap: 10px; width: 360px; }
  .toast { position: relative; display: flex; gap: 12px; padding: 13px 14px 15px 12px; border-radius: 18px; overflow: hidden; cursor: pointer;
           background: linear-gradient(180deg, rgba(22, 20, 30, .97), rgba(10, 10, 14, .97)); border: 1px solid rgba(255, 255, 255, .09);
           box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .8), 0 0 0 1px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .05);
           animation: slideIn .55s var(--spring) both; }
  .toast.out { animation: slideOut .35s var(--ease) both; }
  .toast .mascot { width: 44px; height: 44px; margin-top: -2px; }
  .toast .txt { flex: 1; min-width: 0; }
  .toast .top { display: flex; align-items: center; gap: 7px; }
  .toast .app { font-size: 11px; font-weight: 700; color: var(--violet); letter-spacing: .3px; }
  .toast .when { font-size: 11px; color: var(--dim); margin-left: auto; }
  .toast h3 { margin: 3px 0 2px; font-size: 14px; font-weight: 650; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast p { margin: 0; font-size: 12.6px; line-height: 1.45; color: #b3b3c0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .toast .x { position: absolute; top: 9px; right: 9px; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
              color: var(--dim); opacity: 0; transition: opacity .15s, background .15s; }
  .toast:hover .x { opacity: 1; } .toast .x:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
  .toast .x svg { width: 12px; height: 12px; }
  .toast .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; transform-origin: left;
                background: linear-gradient(90deg, var(--ok), var(--violet)); animation: shrink var(--life) linear forwards; }
  .toast.err .bar { background: var(--err); } .toast:hover .bar { animation-play-state: paused; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(60px) scale(.96); } }
  @keyframes slideOut { to { opacity: 0; transform: translateX(40px) scale(.97); } }
  @keyframes shrink { to { transform: scaleX(0); } }
</style>
</head>
<body>
  <div id="stack"></div>
<script src="mascot.js"></script>
<script src="toast.js"></script>
</body>
</html>
